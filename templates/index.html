<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulasi FSA - Pemilah Sampah Otomatis</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .state-active {
      fill: #9fb2ac !important;
      stroke: #5d0d18 !important;
      stroke-width: 3px !important;
      filter: drop-shadow(0 0 8px rgba(159, 178, 172, 0.9));
    }
    .state-final-active {
      fill: #15803d !important;
      stroke: #5d0d18 !important;
      stroke-width: 3px !important;
      filter: drop-shadow(0 0 8px rgba(21, 128, 61, 0.9));
    }
    .state-error-active {
      fill: #b91c1c !important;
      stroke: #5d0d18 !important;
      stroke-width: 3px !important;
      filter: drop-shadow(0 0 8px rgba(185, 28, 28, 0.9));
    }
  </style>
</head>
<body class="bg-[#fff9eb] text-[#5d0d18] min-h-screen font-sans">

  <!-- Header -->
  <header class="border-b border-[#9fb2ac] bg-[#fff9eb]/90 backdrop-blur px-6 py-4 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold text-[#5d0d18]">WasteAutomata v1.0 (Flask Engine)</h1>
        <p class="text-xs text-[#5d0d18]/80">Simulasi Pemroses Sampah Otomatis Berbasis Finite State Automata (DFA)</p>
      </div>
      <span class="bg-[#9fb2ac]/30 text-[#5d0d18] border border-[#9fb2ac] text-xs px-3 py-1 rounded-full font-mono font-semibold">
        Tuple: M = (Q, Σ, δ, q0, F)
      </span>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">

    <!-- Panel Kontrol -->
    <section class="lg:col-span-1 bg-white/70 border border-[#9fb2ac] rounded-xl p-5 flex flex-col gap-5 shadow-sm">
      <h2 class="text-lg font-semibold text-[#5d0d18] border-b border-[#9fb2ac] pb-2">Kontrol Input Sensor</h2>
      
      <!-- Uji Sequence -->
      <div class="flex flex-col gap-2">
        <label for="stringInput" class="text-xs font-semibold text-[#5d0d18]/80">Masukkan Sequence Input (Pisah Koma):</label>
        <div class="flex gap-2">
          <input type="text" id="stringInput" placeholder="Contoh: item, o, c" value="item, o, c" class="bg-[#fff9eb] border border-[#9fb2ac] text-[#5d0d18] rounded-lg px-3 py-2 text-sm w-full focus:outline-none font-mono">
          <button id="btnRunSequence" class="bg-[#5d0d18] hover:bg-[#5d0d18]/90 text-[#fff9eb] text-xs px-4 rounded-lg font-medium transition">Jalankan</button>
        </div>
      </div>

      <!-- Presets Tombol Cepat -->
      <div class="flex flex-col gap-2 border-t border-[#9fb2ac] pt-4">
        <label class="text-xs font-semibold text-[#5d0d18]/80">Uji Preset Skenario Cepat:</label>
        <button onclick="setAndRun('item, o, c')" class="bg-[#9fb2ac]/40 hover:bg-[#9fb2ac]/60 text-[#5d0d18] font-semibold py-2 px-3 rounded-lg text-xs text-left transition border border-[#9fb2ac]">
          🌱 Organik: <code>item, o, c</code>
        </button>
        <button onclick="setAndRun('item, a, c')" class="bg-[#9fb2ac]/40 hover:bg-[#9fb2ac]/60 text-[#5d0d18] font-semibold py-2 px-3 rounded-lg text-xs text-left transition border border-[#9fb2ac]">
          📦 Anorganik: <code>item, a, c</code>
        </button>
        <button onclick="setAndRun('item, m, c')" class="bg-[#9fb2ac]/40 hover:bg-[#9fb2ac]/60 text-[#5d0d18] font-semibold py-2 px-3 rounded-lg text-xs text-left transition border border-[#9fb2ac]">
          ⚙️ Logam: <code>item, m, c</code>
        </button>
        <button onclick="setAndRun('item, x')" class="bg-[#5d0d18] hover:bg-[#5d0d18]/90 text-[#fff9eb] font-semibold py-2 px-3 rounded-lg text-xs text-left transition">
          ❌ Anomali/Error: <code>item, x</code>
        </button>
      </div>

      <button id="btnReset" class="bg-[#fff9eb] hover:bg-white text-[#5d0d18] border border-[#5d0d18] text-xs font-bold py-2 rounded-lg mt-auto transition">
        Reset Mesin (q0)
      </button>
    </section>

    <!-- Visualizer & Console -->
    <section class="lg:col-span-2 bg-white/70 border border-[#9fb2ac] rounded-xl p-5 flex flex-col gap-4 shadow-sm">
      <div class="flex justify-between items-center border-b border-[#9fb2ac] pb-2">
        <h2 class="text-lg font-semibold text-[#5d0d18]">Diagram Transisi DFA</h2>
        <div class="bg-[#9fb2ac]/30 border border-[#9fb2ac] text-[#5d0d18] text-xs font-mono px-3 py-1 rounded-full">
          State Aktif: <span id="currentStateText" class="font-bold text-[#5d0d18]">q0 (Standby)</span>
        </div>
      </div>

      <!-- SVG Diagram -->
      <div class="bg-[#fff9eb] border border-[#9fb2ac] rounded-lg p-4 flex justify-center items-center overflow-x-auto">
        <svg width="600" height="280" viewBox="0 0 600 280" class="w-full h-auto">
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="22" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#5d0d18" />
            </marker>
          </defs>

          <path d="M 70 140 L 140 140" stroke="#5d0d18" stroke-width="2" marker-end="url(#arrow)" />
          <path d="M 190 120 L 260 60" stroke="#5d0d18" stroke-width="2" marker-end="url(#arrow)" />
          <path d="M 200 140 L 260 140" stroke="#5d0d18" stroke-width="2" marker-end="url(#arrow)" />
          <path d="M 190 160 L 260 220" stroke="#5d0d18" stroke-width="2" marker-end="url(#arrow)" />
          <path d="M 170 170 L 170 230" stroke="#5d0d18" stroke-width="2" marker-end="url(#arrow)" />

          <path d="M 320 60 L 490 120" stroke="#5d0d18" stroke-width="2" marker-end="url(#arrow)" />
          <path d="M 320 140 L 480 140" stroke="#5d0d18" stroke-width="2" marker-end="url(#arrow)" />
          <path d="M 320 220 L 490 160" stroke="#5d0d18" stroke-width="2" marker-end="url(#arrow)" />

          <text x="95" y="130" fill="#5d0d18" font-size="11" font-weight="bold">item</text>
          <text x="210" y="80" fill="#5d0d18" font-size="11" font-weight="bold">o</text>
          <text x="225" y="130" fill="#5d0d18" font-size="11" font-weight="bold">a</text>
          <text x="210" y="200" fill="#5d0d18" font-size="11" font-weight="bold">m</text>
          <text x="175" y="205" fill="#b91c1c" font-size="11" font-weight="bold">x</text>
          <text x="400" y="80" fill="#5d0d18" font-size="11" font-weight="bold">c</text>
          <text x="400" y="130" fill="#5d0d18" font-size="11" font-weight="bold">c</text>
          <text x="400" y="200" fill="#5d0d18" font-size="11" font-weight="bold">c</text>

          <circle id="node-q0" cx="50" cy="140" r="22" fill="#fff9eb" stroke="#5d0d18" stroke-width="2" class="state-active"/>
          <text x="50" y="144" fill="#5d0d18" font-size="12" text-anchor="middle" font-weight="bold">q0</text>

          <circle id="node-q1" cx="170" cy="140" r="22" fill="#fff9eb" stroke="#5d0d18" stroke-width="2"/>
          <text x="170" y="144" fill="#5d0d18" font-size="12" text-anchor="middle" font-weight="bold">q1</text>

          <circle id="node-q2" cx="290" cy="50" r="22" fill="#fff9eb" stroke="#5d0d18" stroke-width="2"/>
          <text x="290" y="54" fill="#5d0d18" font-size="12" text-anchor="middle" font-weight="bold">q2</text>

          <circle id="node-q3" cx="290" cy="140" r="22" fill="#fff9eb" stroke="#5d0d18" stroke-width="2"/>
          <text x="290" y="144" fill="#5d0d18" font-size="12" text-anchor="middle" font-weight="bold">q3</text>

          <circle id="node-q4" cx="290" cy="230" r="22" fill="#fff9eb" stroke="#5d0d18" stroke-width="2"/>
          <text x="290" y="234" fill="#5d0d18" font-size="12" text-anchor="middle" font-weight="bold">q4</text>

          <circle id="node-q5" cx="170" cy="250" r="18" fill="#fff9eb" stroke="#b91c1c" stroke-width="2"/>
          <text x="170" y="254" fill="#b91c1c" font-size="10" text-anchor="middle" font-weight="bold">q5</text>

          <circle id="node-q6" cx="510" cy="140" r="24" fill="#fff9eb" stroke="#15803d" stroke-width="2"/>
          <circle cx="510" cy="140" r="18" fill="none" stroke="#15803d" stroke-width="1.5"/>
          <text x="510" y="144" fill="#15803d" font-size="12" text-anchor="middle" font-weight="bold">q6</text>
        </svg>
      </div>

      <!-- Console Log -->
      <div class="flex flex-col gap-2">
        <h3 class="text-xs font-semibold text-[#5d0d18]">Log Eksekusi Real-time (Server Response):</h3>
        <div id="logConsole" class="bg-[#fff9eb] border border-[#9fb2ac] rounded-lg p-3 font-mono text-xs h-36 overflow-y-auto flex flex-col gap-1 text-[#5d0d18]">
          <span class="text-[#5d0d18]/70">[System] Siap menerima input...</span>
        </div>
      </div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
